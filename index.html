<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 문제</title>
    <link href="/public/output.css" rel="stylesheet"> 

    <link href="/style.css" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
</head>
<body class="bg-gray-100 text-gray-800">
    
    <div id="app" class="max-w-7xl mx-auto p-4 min-h-screen flex flex-col">

        <div id="name-input-screen" class="flex-grow flex items-center justify-center">
            <div class="w-full max-w-md bg-white rounded-xl shadow-2xl p-8 space-y-6">
                <h2 class="text-3xl font-bold text-center text-indigo-600">이름을 입력하세요</h2>
                <form id="name-input-form" class="space-y-6">
                    <div>
                        <label for="user-name" class="text-sm font-medium text-gray-700">이름</label>
                        <input id="user-name" type="text" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white px-4 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">시작하기</button>
                </form>
            </div>
        </div>

        <div id="admin-auth-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-70 z-50 flex items-center justify-center">
            <div class="bg-white rounded-xl shadow-3xl p-8 w-full max-w-sm">
                <h3 class="text-xl font-bold text-gray-800 mb-6 text-center">관리자 인증</h3>
                <form id="admin-auth-form" class="space-y-6">
                    <div>
                        <label for="admin-id" class="text-sm font-medium text-gray-700">관리자 ID</label>
                        <input id="admin-id" type="text" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div class="relative">
                        <label for="admin-password" class="text-sm font-medium text-gray-700">비밀번호</label>
                        <input id="admin-password" type="password" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                    <p id="admin-auth-error" class="text-red-500 text-sm hidden">ID 또는 비밀번호가 일치하지 않습니다.</p>
                    <div class="flex justify-end space-x-4 pt-2">
                         <button type="button" id="cancel-admin-auth" class="bg-gray-300 text-gray-800 px-6 py-2 rounded-lg hover:bg-gray-400 transition">취소</button>
                         <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">인증</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="loading-overlay" class="hidden fixed inset-0 bg-white bg-opacity-75 z-50 flex items-center justify-center">
            <div class="flex flex-col items-center">
                <div class="loader"></div>
                <p class="mt-4 text-lg font-medium text-indigo-600">로딩 중...</p>
            </div>
        </div>

        <div id="main-app-screen" class="hidden flex-grow flex flex-col">
            <header class="flex justify-between items-center py-4 border-b-2 border-indigo-100">
                <h1 class="text-4xl font-extrabold text-indigo-600 tracking-tight">Quiz Mate</h1>
                <div class="flex items-center space-x-4">
                    <span id="welcome-message" class="text-lg font-medium text-gray-700">환영합니다, <span id="current-user-name" class="font-bold"></span>님!</span>
                    <button id="admin-mode-toggle" class="bg-yellow-500 text-gray-800 px-4 py-2 rounded-lg font-semibold hover:bg-yellow-600 transition hidden">
                        관리자 모드
                    </button>
                </div>
            </header>

            <nav class="flex space-x-6 border-b border-gray-200 mt-2">
                <button data-view="problems" class="tab-button text-lg font-semibold py-3 px-1 border-b-4 border-transparent text-indigo-600 transition duration-150">문제 목록</button>
                <button data-view="users" class="tab-button text-lg font-semibold py-3 px-1 border-b-4 border-transparent hover:border-indigo-200 transition duration-150">사용자 목록</button>
                <button data-view="addProblem" class="tab-button text-lg font-semibold py-3 px-1 border-b-4 border-transparent hover:border-indigo-200 transition duration-150 hidden">문제 추가</button>
                <button data-view="account" class="tab-button text-lg font-semibold py-3 px-1 border-b-4 border-transparent hover:border-indigo-200 transition duration-150">계정 관리</button>
            </nav>

            <main class="flex-grow py-6">

                <div id="problem-view" class="main-view space-y-6">
                    <h2 class="text-3xl font-bold text-indigo-700">금주의 퀴즈</h2>
                    
                    <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                        <div class="flex justify-between items-center mb-4">
                            <button id="prev-month-btn" class="text-indigo-600 hover:text-indigo-800 transition p-2 rounded-full hover:bg-indigo-50">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                            </button>
                            <h3 id="current-month-year" class="text-xl font-semibold text-gray-800"></h3>
                            <button id="next-month-btn" class="text-indigo-600 hover:text-indigo-800 transition p-2 rounded-full hover:bg-indigo-50">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                            </button>
                        </div>
                        <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center">
                            <div class="text-sm font-medium text-red-500 py-2">일</div>
                            <div class="text-sm font-medium text-gray-500 py-2">월</div>
                            <div class="text-sm font-medium text-gray-500 py-2">화</div>
                            <div class="text-sm font-medium text-gray-500 py-2">수</div>
                            <div class="text-sm font-medium text-gray-500 py-2">목</div>
                            <div class="text-sm font-medium text-gray-500 py-2">금</div>
                            <div class="text-sm font-medium text-blue-500 py-2">토</div>
                            </div>
                    </div>

                    <div id="daily-problems-container" class="space-y-4">
                        <h3 id="daily-problems-header" class="text-2xl font-semibold text-gray-700"></h3>
                        <div id="daily-problems-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <p id="no-problems-msg" class="text-gray-500 italic hidden col-span-full">선택된 날짜에는 등록된 문제가 없습니다.</p>
                        </div>
                    </div>
                </div>

                <div id="user-list-view" class="main-view space-y-6 hidden">
                    <h2 class="text-3xl font-bold text-indigo-700">사용자 목록</h2>
                    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">이름</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">가입일</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">관리자</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">관리</th>
                                </tr>
                            </thead>
                            <tbody id="user-list-body" class="bg-white divide-y divide-gray-200">
                                </tbody>
                        </table>
                    </div>
                    <div id="user-edit-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-70 z-50 flex items-center justify-center">
                        <div class="bg-white rounded-xl shadow-3xl p-8 w-full max-w-md">
                            <h3 class="text-xl font-bold text-gray-800 mb-6">사용자 정보 수정</h3>
                            <form id="user-edit-form" class="space-y-4">
                                <div>
                                    <label for="edit-user-name" class="text-sm font-medium text-gray-700">이름</label>
                                    <input id="edit-user-name" type="text" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                                <div class="flex items-center">
                                    <input id="edit-user-admin" type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                                    <label for="edit-user-admin" class="ml-2 text-sm font-medium text-gray-700">관리자 권한 부여</label>
                                </div>
                                <div class="flex justify-end space-x-4 pt-4">
                                     <button type="button" id="cancel-edit-user" class="bg-gray-300 text-gray-800 px-6 py-2 rounded-lg hover:bg-gray-400 transition">취소</button>
                                     <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">저장</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div id="add-problem-view" class="main-view space-y-6 hidden">
                    <h2 class="text-3xl font-bold text-indigo-700">새 문제 등록</h2>
                    <form id="add-problem-form" class="bg-white p-8 rounded-xl shadow-lg space-y-6">
                        <div>
                            <label for="problem-date" class="block text-sm font-medium text-gray-700">문제 날짜</label>
                            <input type="date" id="problem-date" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>

                        <div>
                            <label for="question-text" class="block text-sm font-medium text-gray-700">질문 내용</label>
                            <textarea id="question-text" rows="3" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                        </div>

                        <div>
                            <label for="question-image" class="block text-sm font-medium text-gray-700">질문 이미지 (선택 사항)</label>
                            <input type="file" id="question-image" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                            <img id="image-preview" class="mt-4 max-h-40 hidden rounded-lg shadow-md" alt="Image Preview">
                        </div>

                        <div id="options-container" class="space-y-4 border p-4 rounded-lg bg-gray-50">
                            <h4 class="text-lg font-semibold text-gray-700">선택지</h4>
                            <div class="flex items-center space-x-2">
                                <input type="radio" name="correct-option" value="0" required class="h-4 w-4 text-green-600 border-gray-300 focus:ring-green-500">
                                <input type="text" placeholder="선택지 1" data-option-value="0" required class="option-input flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div class="flex items-center space-x-2">
                                <input type="radio" name="correct-option" value="1" required class="h-4 w-4 text-green-600 border-gray-300 focus:ring-green-500">
                                <input type="text" placeholder="선택지 2" data-option-value="1" required class="option-input flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                        </div>

                        <div class="flex justify-end space-x-4">
                            <button type="button" id="add-option-btn" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-semibold hover:bg-gray-300 transition">선택지 추가</button>
                            <button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">문제 등록</button>
                        </div>
                    </form>
                </div>

                <div id="account-view" class="main-view space-y-6 hidden">
                    <h2 class="text-3xl font-bold text-indigo-700">계정 관리</h2>
                    <div class="bg-white p-8 rounded-xl shadow-lg space-y-6">
                        <h3 class="text-xl font-semibold border-b pb-2">나의 정보</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="text-gray-500 font-medium">이름:</div>
                            <div id="display-name" class="font-bold text-gray-800"></div>
                            <div class="text-gray-500 font-medium">가입일:</div>
                            <div id="display-created-at" class="font-bold text-gray-800"></div>
                            <div class="text-gray-500 font-medium">권한:</div>
                            <div id="display-is-admin" class="font-bold text-gray-800"></div>
                        </div>
                        <button id="logout-btn" class="bg-red-500 text-white px-6 py-2 rounded-lg font-semibold hover:bg-red-600 transition">로그아웃</button>
                    </div>
                </div>

            </main>
        </div>

        <div id="problem-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-70 z-50 flex items-center justify-center">
            <div class="bg-white rounded-xl shadow-3xl p-8 w-full max-w-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
                <div class="flex justify-between items-start mb-6 border-b pb-4">
                    <h3 id="modal-problem-header" class="text-2xl font-bold text-indigo-700"></h3>
                    <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                
                <div id="modal-problem-content" class="space-y-6">
                    </div>

                <div id="modal-problem-footer" class="mt-6 pt-4 border-t">
                    </div>
            </div>
        </div>


        <div id="custom-alert-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-70 z-[60] flex items-center justify-center">
            <div class="bg-white rounded-xl shadow-3xl p-8 w-full max-w-sm text-center">
                <p id="custom-alert-message" class="text-lg font-medium text-gray-800 mb-6"></p>
                <button id="custom-alert-ok-btn" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">확인</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script> 
    <script src="/script.js"></script>
</body>
</html>
